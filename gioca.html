<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operandi — Gioca</title>
<meta name="description" content="Play Operandi, the cozy math puzzle game: combine numbers with +, −, × and ÷ to hit the target. Free on Google Play and the App Store.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, #16294a 0%, #0d1b2e 55%, #081226 100%);
    color: #e8eefb; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    text-align: center; overflow-x: hidden;
  }
  main { flex: 1; display: flex; flex-direction: column; align-items: center;
         justify-content: center; padding: 48px 24px; position: relative; }
  .glyph { position: absolute; font-weight: 800; opacity: .85;
           animation: float 4s ease-in-out infinite alternate; user-select: none; }
  @keyframes float { from { transform: translateY(-6px) rotate(-8deg); }
                     to   { transform: translateY(6px) rotate(6deg); } }
  h1 { font-size: clamp(44px, 9vw, 72px); letter-spacing: 2px; color: #fff;
       text-shadow: 0 4px 0 #97a6c4, 0 12px 28px rgba(0,0,0,.6); }
  .tagline { margin-top: 10px; font-size: clamp(13px, 2.6vw, 17px); font-weight: 800;
             letter-spacing: 7px; color: #ffc24a;
             text-shadow: 0 2px 0 #8a5f13, 0 6px 14px rgba(0,0,0,.6); }
  .pitch { margin-top: 26px; max-width: 460px; line-height: 1.65; color: #b9c7e2;
           font-size: 16px; }
  .stores { margin-top: 34px; display: flex; gap: 12px; justify-content: center;
            flex-wrap: wrap; }
  .store { padding: 14px 26px; border-radius: 14px; font-size: 15px;
           font-weight: 800; text-decoration: none; color: #fff;
           box-shadow: 0 6px 16px rgba(0,0,0,.45);
           border-bottom: 5px solid rgba(0,0,0,.35); }
  .store.play { background: linear-gradient(#58b368, #3f9750); }
  .store.apple { background: linear-gradient(#58a8e8, #3a7fc0); }
  footer { padding: 26px 16px 34px; font-size: 13px; color: #8fa6c9; }
  footer a { color: #b9c7e2; text-decoration: underline; text-underline-offset: 3px; }
  footer a:hover { color: #fff; }
</style>
<script>
  // Landed from a shared daily result: hand the phone straight to its
  // store. Desktops and unknown platforms stay on the page with both
  // badges.
  const PLAY_URL =
    'https://play.google.com/store/apps/details?id=com.zipangulu.numberpuzzle';
  const APP_STORE_URL = 'https://apps.apple.com/app/id6792473833';
  const ua = navigator.userAgent;
  if (/android/i.test(ua)) {
    location.replace(PLAY_URL);
  } else if (/iphone|ipad|ipod/i.test(ua) && APP_STORE_URL) {
    location.replace(APP_STORE_URL);
  }
</script>
</head>
<body>
<main>
  <span class="glyph" style="left:8%;  top:22%; color:#ffc24a; font-size:30px;">+</span>
  <span class="glyph" style="left:14%; bottom:24%; color:#e4635f; font-size:24px; animation-delay:-1.2s;">−</span>
  <span class="glyph" style="right:10%; top:26%; color:#58a8e8; font-size:26px; animation-delay:-2.1s;">×</span>
  <span class="glyph" style="right:15%; bottom:22%; color:#3fbfa8; font-size:28px; animation-delay:-.6s;">÷</span>

  <h1>OPERANDI</h1>
  <div class="tagline">NUMBER PUZZLE</div>

  <p class="pitch">Combine numbers with the four operators to hit the target.
  Handcrafted levels, a fresh daily puzzle, and just the right amount of
  brain-burn.</p>

  <div class="stores">
    <a class="store play" id="play-link" href="https://play.google.com/store/apps/details?id=com.zipangulu.numberpuzzle">Get it on Google Play</a>
    <a class="store apple" id="apple-link" href="#" hidden>Download on the App Store</a>
  </div>
</main>

<footer>
  <a href="privacy-policy.html">Privacy policy</a> ·
  <a href="terms.html">Terms of service</a> ·
  <a href="mailto:zipangulu.dev@gmail.com">Contact</a>
</footer>
<script>
  // The App Store badge appears once its URL is configured above.
  const apple = document.getElementById('apple-link');
  if (APP_STORE_URL) { apple.href = APP_STORE_URL; apple.hidden = false; }
</script>
</body>
</html>
